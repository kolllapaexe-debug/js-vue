<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
    <header class="header">
        <p class="paragraph">Technology &bull; WEB &bull; Design</p>
        <h1>Code Daily</h1>
        <p class="subtitle">News, that appear through JS</p>
    </header>
    <section class="toolbar">
        <p class="counter">
            News found: <strong id="news-count">0</strong>
        </p>
        <div class="filter" aria-label="News filter">
            <button id="show-all" class="filter-btn active">All</button>
            <button id="show-js" class="filter-btn">JavaScript</button>
            <button id="show-design" class="filter-btn">Design</button>
        </div>
    </section>
    <section class="news-grid" id="news-list"></section>
</main>
<script src="script.js"></script>
</body>
</html>
